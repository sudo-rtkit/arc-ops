function renderFull(destination){const c=t(),dest=destination||(empty?c.profile:c.dashboard);$('fullView').innerHTML=`<aside class="sidebar"><div class="head accent">ARC OPS</div>${[c.dashboard,c.profile,c.workshop,c.inventory,c.journal].map(x=>`<div class="nav-item ${x===dest?'active':''}">${x}</div>`).join('')}<div class="meta" style="margin-top:30px">${c.offline}</div></aside><div class="full-body"><div class="row spread"><span class="mono accent">${empty?'—':c.lv+' 20'} &nbsp; · &nbsp; ${empty?'—':num(58313)}</span><button id="collapseFull" style="padding:8px 12px">${c.back}</button></div><h1>${dest}</h1><p>${empty?c.emptyHint:c.fullSub}</p><div class="full-grid">${empty?`<div class="full-card wide"><h2>${c.profile}</h2><p>${en?'Enter your level, XP and coins.':'Doplň svou úroveň, XP a mince.'}</p></div>`:`<div class="full-card"><h2>${c.quests}</h2><p>Shoring Up Defenses <span class="accent mono">3/4</span><br>Battening Down <span class="mono">0/3</span><br>Taking Stock <span class="mono">1/5</span></p></div><div class="full-card"><h2>${c.upgrade}</h2><p>Gear Bench → 2<br>${c.upgradeHint}</p></div><div class="full-card wide"><h2>${c.shopping}</h2>${mats.map(([name,n,d])=>`<p class="row spread">${name}<span class="mono">${n} / ${d}</span></p>`).join('')}</div>`}</div><p class="meta">${en?'Transition sketch · full app simplified':'Skica přechodu · plná aplikace zjednodušena'}</p></div>`;$('collapseFull').onclick=()=>setFull(false)}
let compactScroll=0,detailState={};function setFull(v,dest){if(v){compactScroll=$('content').scrollTop;detailState=Object.fromEntries([...document.querySelectorAll('details')].map(x=>[x.id,x.open]))}full=v;render();if(v)renderFull(dest);else{for(const [id,v]of Object.entries(detailState)){if($(id))$(id).open=v}$('content').scrollTop=compactScroll}$('expand').focus()};function openFull(dest){setFull(true,dest)}
function pin(){if(full)return;pinned=!pinned;$('pin').setAttribute('aria-pressed',pinned);$('pinToggle').checked=pinned;toast(pinned?t().toastPin:t().toastUnpin)}
$('pin').onclick=pin;$('pinToggle').onchange=pin;$('expand').onclick=()=>{if(hidden){hidden=false;render()}else setFull(!full)};$('close').onclick=()=>{hidden=true;render()};$('minimise').onclick=()=>{$('window').classList.toggle('minimised')};$('restore').onclick=()=>{hidden=false;render()};$('capture').onclick=()=>toast(t().toast);$('raid').onclick=()=>{openFull(t().journal)};$('stash').onclick=()=>openFull(t().inventory);$('emptyToggle').onchange=e=>{empty=e.target.checked;hidden=false;render()};$('enToggle').onchange=e=>{en=e.target.checked;render()};$('shortToggle').onchange=e=>{short=e.target.checked;render()};document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='m'){e.preventDefault();setFull(!full)}if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();pin()}if(e.key==='Escape'&&full)setFull(false)});
