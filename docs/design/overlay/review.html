<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;font:14px/1.5 var(--font-sans,system-ui);color:var(--foreground,#F2EEE7)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{font:inherit;padding:7px 12px;border:1px solid var(--border,#65716F);border-radius:4px;background:var(--secondary,#272D31);color:inherit;cursor:pointer}button[aria-pressed=true]{color:#241810;background:#F4AD82}button:focus-visible{outline:2px solid #F4AD82;outline-offset:3px}figure{margin:0}img{display:block;width:100%;height:auto}figure[hidden]{display:none}p{font-size:12px;color:var(--muted-foreground,#A2A8AA);margin:8px 0 0}
</style><nav aria-label="Grafické návrhy"><button type="button" aria-pressed="true" data-view="overview">Přehled</button><button type="button" aria-pressed="false" data-view="quests">Úkoly</button><button type="button" aria-pressed="false" data-view="shopping">Nákupy</button><button type="button" aria-pressed="false" data-view="capture">Ze snímku</button><button type="button" aria-pressed="false" data-view="states">List stavů</button></nav><figure id="overview"><img src="overview.png" alt="Přehled — grafický návrh overlaye"></figure><figure id="quests" hidden><img src="quests.png" alt="Úkoly — grafický návrh overlaye"></figure><figure id="shopping" hidden><img src="shopping.png" alt="Nákupy — grafický návrh overlaye"></figure><figure id="capture" hidden><img src="capture.png" alt="Ze snímku — grafický návrh overlaye"></figure><figure id="states" hidden><img src="states.png" alt="List stavů — grafický návrh overlaye"></figure><p>PNG záložek: 1920 × 1080 · panel 1100 × 760 · původní syntetické pozadí · list stavů obsahuje krytí, fokus, hover, prázdný a chybový stav.</p><script>
for(const b of document.querySelectorAll('button'))b.onclick=()=>{for(const f of document.querySelectorAll('figure'))f.hidden=f.id!==b.dataset.view;for(const x of document.querySelectorAll('button'))x.setAttribute('aria-pressed',String(x===b));};
</script></html>
