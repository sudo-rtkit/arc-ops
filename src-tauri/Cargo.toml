[package]
name = "arc-companion"
version = "0.21.0"
description = "ARC Raiders Companion – osobní operační centrum hráče. Neoficiální, offline."
edition = "2021"
publish = false

[lib]
name = "arc_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
# 0.20.0: jen testy (src-tauri/tests/headers.rs čte lokální snímky), stejná verze jako už v Cargo.lock
png = "0.18"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
