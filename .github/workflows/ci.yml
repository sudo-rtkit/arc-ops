# ARC Raiders Companion: tests on every push to main and on pull requests (0.21.0).
# No secrets, read-only token. The repository is public; the jobs stay lean on purpose:
# one Linux job for the web app (typecheck, Vitest, build, Playwright E2E) and one Windows job for the Rust tests.
# The NSIS installer is not built here. Local-only player screenshots (tests/fixtures/vision/own/) are not in the
# repository; the tests that need them skip themselves.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (tsc, Vitest, build, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      # Locally the E2E tests use the installed Microsoft Edge; with CI set, playwright.config.ts falls back to
      # Playwright's Chromium.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  rust:
    name: Rust (cargo test, Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! embeds frontendDist (../dist) at compile time. The Rust tests do not need the real
      # web build, so a placeholder page is enough and keeps this job free of Node.
      - name: Placeholder frontend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>ci</title>' -Encoding utf8

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
